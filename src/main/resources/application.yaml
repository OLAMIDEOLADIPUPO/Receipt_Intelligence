spring:
  application:
    name: ReceiptHandler

  datasource:
    url: jdbc:postgresql://localhost:5432/receipt_scanner_dev
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false

  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

management:
  endpoints:
    web:
      exposure:
        include: health

# OpenAPI / Swagger UI. Spec: /v3/api-docs  •  UI: /swagger-ui.html
# Both paths are permitted without a token in SecurityConfig.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

gemini:
  api:
    key: ${GEMINI_API_KEY}
    url: ${GEMINI_API_URL}


jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: 9000000
  refresh-expiration: 604800000
receipt:
  extraction:
    provider: ${RECEIPT_EXTRACTION_PROVIDER:gemini}

claude:
  api:
    key: ${CLAUDE_API_KEY:}
    url: ${CLAUDE_API_URL:https://api.anthropic.com/v1/messages}
    model: ${CLAUDE_API_MODEL:claude-sonnet-5}
    max-tokens: ${CLAUDE_API_MAX_TOKENS:1024}

